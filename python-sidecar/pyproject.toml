[project]
name = "whisper-sidecar"
version = "0.1.0"
description = "FastAPI sidecar that runs mlx-whisper for the Echo Script desktop app."
authors = [
    { name = "Echo Script contributors" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "mlx-whisper>=0.4.3",
    "pydantic-settings>=2",
    "python-multipart>=0.0.29",
    "sse-starlette>=3.4.4",
    "uvicorn[standard]>=0.48.0",
]

[project.scripts]
whisper-sidecar = "whisper_sidecar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

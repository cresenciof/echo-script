# CI workflow — runs on every PR and on pushes to any branch except `master`.
#
# Hardening notes:
# - Uses `pull_request` (NOT `pull_request_target`). PRs from forks therefore
#   run with a read-only GITHUB_TOKEN and CANNOT read repo secrets.
# - All third-party actions pinned to commit SHAs with version comments.
# - Default token permissions are `contents: read` and nothing else.
# - We never check out `${{ github.event.pull_request.head.sha }}` via a custom
#   `ref:` — `pull_request` default is to check out the merge ref, which is
#   what we want.
# - Lockfiles are required (`--frozen-lockfile` / `--frozen` / `--locked`).
# - Audits run with sensible severity thresholds — Python audit is informational
#   only (pip-audit + uv interop is still rough as of 2026-05).

name: ci

on:
  pull_request:
  push:
    branches-ignore:
      - master

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on the same ref to save runner minutes — except on
  # master/release where we never cancel (release.yml owns those).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, cargo check, tests, audit
    runs-on: macos-14
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - name: Checkout source (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable @ 2026-04
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Set up Node.js 22 (pinned)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Set up pnpm (pinned)
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9
          run_install: false

      - name: Install uv with checksum verification (pinned)
        env:
          UV_VERSION: '0.5.11'
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            "https://astral.sh/uv/${UV_VERSION}/install.sh" -o /tmp/uv-install.sh
          curl --proto '=https' --tlsv1.2 -sSf \
            "https://astral.sh/uv/${UV_VERSION}/install.sh.sha256" -o /tmp/uv-install.sh.sha256
          expected="$(awk '{print $1}' /tmp/uv-install.sh.sha256)"
          actual="$(shasum -a 256 /tmp/uv-install.sh | awk '{print $1}')"
          if [[ "${expected}" != "${actual}" ]]; then
            echo "::error::uv installer checksum mismatch (expected=${expected} actual=${actual})" >&2
            exit 1
          fi
          sh /tmp/uv-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Node dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Install Python sidecar dependencies (frozen, with dev extras)
        working-directory: python-sidecar
        run: uv sync --frozen --dev

      # --- Gates -----------------------------------------------------------
      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit

      - name: Rust cargo check
        run: |
          source "$HOME/.cargo/env"
          cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Python pytest
        working-directory: python-sidecar
        run: uv run pytest -q

      # --- Audits ----------------------------------------------------------
      - name: npm dependency audit (high+ only)
        # Don't fail on moderate noise from transitive devDeps — Dependabot
        # picks those up. Fail the build on `high` or `critical`.
        run: pnpm audit --audit-level high --prod

      - name: Rust dependency audit (pinned)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python dependency audit (informational only)
        # pip-audit + uv interop is still bumpy as of 2026-05. We export the
        # locked set, scan it, and let the build pass regardless — failures are
        # logged for human triage but do not gate merges.
        working-directory: python-sidecar
        continue-on-error: true
        run: |
          set +e
          uv pip list --format json > /tmp/py-deps.json
          uv tool run pip-audit --requirement /tmp/py-deps.json
          status=$?
          if [[ $status -ne 0 ]]; then
            echo "::warning::pip-audit reported issues (exit=${status}); see log above."
          fi
          exit 0

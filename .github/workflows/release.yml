# Release workflow — builds and publishes a signed DMG when a semver tag is pushed.
#
# Hardening notes:
# - Every third-party action is pinned to a full commit SHA, with the
#   human-readable version recorded in the trailing comment so a maintainer can
#   cross-check on GitHub (https://github.com/<owner>/<repo>/releases) and so
#   Dependabot can propose SHA bumps over time.
# - Default token permissions are read-only; we escalate to `contents: write`
#   only on the release-publishing step.
# - Tag format is validated as the first step — a malformed tag aborts the run
#   before any build work runs.
# - All package managers run with their respective frozen-lockfile flags so we
#   build exactly what the lockfiles describe.
# - No secrets are referenced other than the auto-managed GITHUB_TOKEN.
#   Notarization / Apple signing is intentionally NOT wired up yet — see TODOs.

name: release

on:
  push:
    tags:
      - 'v*.*.*'

# Default to least privilege. Individual steps re-declare what they need.
permissions:
  contents: read

concurrency:
  # Allow concurrent releases (one per tag) — never cancel an in-flight publish.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish macOS arm64 DMG
    runs-on: macos-14
    # contents: write is required by the publish step (softprops/action-gh-release).
    # GitHub Actions does NOT support per-step permission overrides, so the whole
    # job runs with write scope. Every preceding step is read-only by behavior,
    # and the only mutating action is pinned to a SHA we control via Dependabot.
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      - name: Validate semver tag (v<major>.<minor>.<patch>)
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${tag}' is not strict semver vMAJOR.MINOR.PATCH — refusing to build." >&2
            exit 1
          fi
          echo "Tag ${tag} validated."

      - name: Checkout source (pinned)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (node24)
        with:
          # Explicitly do NOT pass `ref` — checkout the exact commit the tag
          # points at, never an attacker-controllable input.
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable @ 2026-04
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Set up Node.js 22 (pinned)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (node24)
        with:
          node-version: '22'

      - name: Set up pnpm (pinned)
        uses: pnpm/action-setup@f3d73ada1fa6e5c0c19973ff70a3f5cabf225cc5 # v6.0.0 (node24)
        with:
          version: 10.13.1
          run_install: false

      - name: Install uv (pinned, official action from Astral)
        # astral-sh/setup-uv is published by the same team that maintains uv.
        # Pinning by commit SHA gives us the same supply-chain guarantee as
        # SHA-verifying an installer script — Dependabot will propose bumps.
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Xcode CLT sanity check
        run: |
          set -euo pipefail
          xcode-select -p
          clang --version

      - name: Install Node dependencies (frozen)
        # pnpm 10 in CI ignores both `pnpm-workspace.yaml` and the `pnpm` field
        # in `package.json` for `onlyBuiltDependencies`. To unblock the build
        # deterministically, skip all postinstall scripts during install and
        # then explicitly rebuild esbuild — the one package that legitimately
        # needs its postinstall (downloads platform native binary).
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild

      - name: Install Python sidecar dependencies (frozen)
        working-directory: python-sidecar
        run: uv sync --frozen

      - name: Build relocatable Python sidecar bundle
        # MUST run before cargo check — Tauri's build.rs validates
        # bundle.resources paths at compile time, so .venv-bundle must
        # exist before any cargo invocation.
        run: bash scripts/build-sidecar-bundle.sh

      - name: Pre-release sanity — TypeScript typecheck
        run: pnpm exec tsc --noEmit

      - name: Pre-release sanity — cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Pre-release sanity — Python tests
        working-directory: python-sidecar
        run: uv run pytest -q

      - name: Build DMG via Tauri
        # TODO: when an Apple Developer ID cert + notarization credentials are
        # available, expose them via secrets and set:
        #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
        #   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        # The DMG produced below is currently UNSIGNED / UNNOTARIZED.
        run: pnpm tauri build

      - name: Compute SHA256 of DMG artifact(s)
        id: hash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          if (( ${#dmgs[@]} == 0 )); then
            echo "::error::No DMG produced under src-tauri/target/release/bundle/dmg/" >&2
            exit 1
          fi
          shasum -a 256 "${dmgs[@]}" | tee SHA256SUMS.txt

      - name: Publish GitHub Release (pinned)
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0 (node24)
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            Auto-built release for ${{ github.ref_name }}. Verify the DMG hash against `SHA256SUMS.txt`.
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            SHA256SUMS.txt

# Dependabot configuration.
#
# Why this matters for a SHA-pinned workflow setup:
#   The `github-actions` ecosystem below is CRITICAL. Because every action in
#   release.yml / ci.yml is pinned to a commit SHA, Dependabot is the
#   mechanism that bumps those SHAs when upstream actions cut a new release.
#   Without it, our pins silently rot.
#
# All ecosystems use the `chore(deps):` commit prefix so dependency churn does
# not pollute the user-facing changelog, and group minor + patch updates per
# ecosystem to keep PR volume manageable.

version: 2
updates:
  # -----------------------------------------------------------------------
  # GitHub Actions — bumps SHAs for actions/* and third-party actions used
  # in .github/workflows/*.yml. KEEP THIS ENABLED.
  # -----------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # NOTE: unlike npm/cargo/pip below, we ALLOW majors for github-actions.
    # Action majors typically bump the JS runtime (e.g. Node 20 -> 24) rather
    # than change the action's input/output API. Blocking majors here would
    # silently let actions become deprecated and eventually broken. CI will
    # still catch any API breakage from a bad bump.
    groups:
      actions-all:
        update-types:
          - "major"
          - "minor"
          - "patch"

  # -----------------------------------------------------------------------
  # npm — root package.json (Vite + React + Tailwind + Tauri JS API).
  # -----------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # -----------------------------------------------------------------------
  # Cargo — Tauri 2 Rust shell.
  # -----------------------------------------------------------------------
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # -----------------------------------------------------------------------
  # Python — FastAPI sidecar managed via uv / pyproject.toml.
  # Dependabot's `pip` ecosystem reads pyproject.toml directly.
  # -----------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/python-sidecar"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
